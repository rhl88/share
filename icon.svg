<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120" role="img" aria-label="一键分享">
    <title>一键分享</title>
    <defs>
        <!-- 主背景渐变：亮蓝 → 靛蓝 → 紫，与同系列应用图标保持同一视觉语言 -->
        <linearGradient id="shBg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#3E86FF"/>
            <stop offset="0.52" stop-color="#5B6BFF"/>
            <stop offset="1" stop-color="#8A4BEF"/>
        </linearGradient>
        <!-- 左上角柔光，提升通透感 -->
        <radialGradient id="shGlow" cx="0.28" cy="0.22" r="0.82">
            <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.34"/>
            <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
        </radialGradient>
        <!-- 右下角暗部，增加底板纵深 -->
        <radialGradient id="shShade" cx="0.84" cy="0.9" r="0.78">
            <stop offset="0" stop-color="#2A1A7A" stop-opacity="0.26"/>
            <stop offset="1" stop-color="#2A1A7A" stop-opacity="0"/>
        </radialGradient>
        <!-- 分享连线：水平方向由亮到柔 -->
        <linearGradient id="shLine" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.96"/>
            <stop offset="1" stop-color="#E6EDFF" stop-opacity="0.9"/>
        </linearGradient>
        <!-- 扩散节点：白色渐变圆 -->
        <linearGradient id="shNode" x1="0" y1="0" x2="0.35" y2="1">
            <stop offset="0" stop-color="#FFFFFF"/>
            <stop offset="1" stop-color="#DCE7FF"/>
        </linearGradient>
        <!-- 源头节点：金色渐变圆，强调「一个入口 → 多渠道扩散」 -->
        <linearGradient id="shHub" x1="0" y1="0" x2="0.4" y2="1">
            <stop offset="0" stop-color="#FFE9A8"/>
            <stop offset="1" stop-color="#FFC24D"/>
        </linearGradient>
    </defs>

    <!-- 圆角底板与光影 -->
    <rect x="0" y="0" width="120" height="120" rx="27" fill="url(#shBg)"/>
    <rect x="0" y="0" width="120" height="120" rx="27" fill="url(#shGlow)"/>
    <rect x="0" y="0" width="120" height="120" rx="27" fill="url(#shShade)"/>
    <rect x="0.75" y="0.75" width="118.5" height="118.5" rx="26.25"
          fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1.5"/>

    <!-- 节点柔光晕 -->
    <g fill="#FFFFFF" fill-opacity="0.11">
        <circle cx="35" cy="60" r="21"/>
        <circle cx="85" cy="31" r="19"/>
        <circle cx="85" cy="89" r="19"/>
    </g>

    <!-- 分享连线：外层泛光 + 内层实线，保证缩小后仍清晰 -->
    <g fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="14" stroke-linecap="round">
        <path d="M35 60 L85 31"/>
        <path d="M35 60 L85 89"/>
    </g>
    <g fill="none" stroke="url(#shLine)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M35 60 L85 31"/>
        <path d="M35 60 L85 89"/>
    </g>

    <!-- 源头节点 -->
    <circle cx="35" cy="60" r="12.5" fill="url(#shHub)"/>
    <circle cx="35" cy="60" r="12.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="1.2"/>
    <circle cx="35" cy="60" r="4.3" fill="#FFFFFF"/>

    <!-- 两个扩散节点 -->
    <g fill="url(#shNode)">
        <circle cx="85" cy="31" r="12.5"/>
        <circle cx="85" cy="89" r="12.5"/>
    </g>
    <g fill="none" stroke="#4A5BD0" stroke-opacity="0.14" stroke-width="1.2">
        <circle cx="85" cy="31" r="12.5"/>
        <circle cx="85" cy="89" r="12.5"/>
    </g>
    <g fill="#5B63E8">
        <circle cx="85" cy="31" r="4.3"/>
        <circle cx="85" cy="89" r="4.3"/>
    </g>

    <!-- 裂变亮点 -->
    <g fill="#FFD98A">
        <path d="M102 14 Q102.9 19.1 108 20 Q102.9 20.9 102 26 Q101.1 20.9 96 20 Q101.1 19.1 102 14 Z" fill-opacity="0.95"/>
        <path d="M100 98 Q100.5 102.5 105 103 Q100.5 103.5 100 108 Q99.5 103.5 95 103 Q99.5 102.5 100 98 Z" fill-opacity="0.75"/>
    </g>
</svg>
